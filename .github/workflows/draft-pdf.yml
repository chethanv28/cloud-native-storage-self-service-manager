name: Draft PDF
on:
  push:
    paths:
      - "Observability/paper/**"
      - ".github/workflows/draft-pdf.yml"
  pull_request:
    paths:
      - "Observability/paper/**"
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: Observability/paper/paper.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: Observability/paper/paper.pdf
